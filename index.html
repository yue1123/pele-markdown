    <title>pele-markdown playground</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash
      try {
        const theme = localStorage.getItem('theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {}
    </script>

    <main class="panes">
      <section class="pane">
        <div class="pane-head">
          <span class="pane-title">Markdown</span>
          <button type="button" class="link" id="setup-toggle" aria-expanded="false">Setup code</button>
        </div>
        <pre class="setup" id="setup" hidden><code></code></pre>
        <textarea id="source" spellcheck="false" aria-label="Markdown source"></textarea>
      </section>

      <section class="pane">
        <div class="pane-head">
          <div class="tabs small" role="tablist">
            <button type="button" role="tab" data-view="preview" aria-selected="true">Preview</button>
            <button type="button" role="tab" data-view="html" aria-selected="false">HTML</button>
          </div>
          <span class="status" id="status"></span>
        </div>
        <article class="preview" id="preview"></article>
        <pre class="html" id="html" hidden><code></code></pre>
      </section>
    </main>
