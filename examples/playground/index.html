<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pele-markdown playground</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><rect x=%221%22 y=%225%22 width=%225%22 height=%226%22 rx=%221%22 fill=%22%23205ea6%22/><rect x=%2210%22 y=%225%22 width=%225%22 height=%226%22 rx=%221%22 fill=%22%23205ea6%22/><path d=%22M6 8h4%22 stroke=%22%23205ea6%22/></svg>" />
  </head>
  <body>
    <header class="topbar">
      <h1 class="brand">pele-markdown <span>playground</span></h1>
      <nav class="tabs" id="renderers" aria-label="Markdown library"></nav>
      <label class="sample">
        <span>Sample</span>
        <select id="sample"></select>
      </label>
    </header>

    <main class="panes">
      <section class="pane">
        <div class="pane-head">
          <span class="pane-title">Markdown</span>
          <button type="button" class="link" id="setup-toggle" aria-expanded="false">Setup code</button>
        </div>
        <pre class="setup" id="setup" hidden><code></code></pre>
        <textarea id="source" spellcheck="false" aria-label="Markdown source"></textarea>
      </section>

      <section class="pane">
        <div class="pane-head">
          <div class="tabs small" role="tablist">
            <button type="button" role="tab" data-view="preview" aria-selected="true">Preview</button>
            <button type="button" role="tab" data-view="html" aria-selected="false">HTML</button>
          </div>
          <span class="status" id="status"></span>
        </div>
        <article class="preview" id="preview"></article>
        <pre class="html" id="html" hidden><code></code></pre>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
